name: Research refresh
on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
concurrency:
  group: research-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore last successful public snapshot if available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view research-feed --json body --jq .body > /tmp/previous-feed.json; then
            python -c 'import json,pathlib; p=pathlib.Path("/tmp/previous-feed.json"); j=json.loads(p.read_text()); assert j.get("rows"); pathlib.Path("knowledge/feed.json").write_text(p.read_text())'
          fi
      - run: python scripts/refresh_sources.py
      - run: python scripts/dem_pilot.py
      - run: python scripts/build_site.py
      - run: python -m pytest tests/ -q
      - name: Browser integration checks
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: research-evidence
          path: |
            knowledge/feed.json
            knowledge/session2/dem_pilot.json
            scratch/browser/
      - name: Publish machine-readable feed without committing to any branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view research-feed >/dev/null 2>&1; then
            gh release edit research-feed --notes-file knowledge/feed.json --latest=false
          else
            gh release create research-feed --target "$GITHUB_SHA" --title "Automated research feed" --notes-file knowledge/feed.json --latest=false
          fi
          gh release upload research-feed knowledge/feed.json knowledge/session2/dem_pilot.json --clobber
