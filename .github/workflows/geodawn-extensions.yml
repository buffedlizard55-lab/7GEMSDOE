name: GeoDAWN ratio and upward-continuation grids
# H9c enabler. Runs only on manual dispatch or a session-branch push whose
# commit message starts with [run-extensions]. It downloads checksum-listed
# official Area 1/2 GeoTIFF archives, selects exact contractor ratio/upward-
# continuation members, and commits only a compact product plus provenance.
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/geodawn-extensions.yml"
      - "scripts/geodawn_extensions.py"
      - "scripts/geodawn_rad.py"
permissions:
  contents: write
concurrency:
  group: geodawn-extensions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[run-extensions]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 scipy==1.17.1 rasterio==1.4.4 pytest==9.1.1
      - name: Hermetic extension-selection tests
        run: python -m pytest -q tests/test_geodawn_extensions.py tests/test_geodawn_rad.py
      - name: Restore competition grid
        run: |
          bash scripts/download_competition_data.sh
          python scripts/verify_data.py
      - name: Build official extension channels
        run: python scripts/geodawn_extensions.py
      - name: Preserve fail-closed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geodawn-extensions-diagnostics-${{ github.run_id }}
          path: external/geodawn_extensions/observed_files.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit compact product to this session branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external/geodawn_extensions
          git commit -m "Add GeoDAWN extension grids (run ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 10
          done
